<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Northstar — General form</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #171713;
        background: #f3efe6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 40px 22px;
        background:
          radial-gradient(circle at 12% 85%, #ffd977 0 10%, transparent 30%),
          #f3efe6;
      }

      main {
        width: min(760px, 100%);
        overflow: hidden;
        border: 1px solid rgba(23, 23, 19, 0.13);
        border-radius: 32px;
        background: #fffdf8;
        box-shadow: 0 28px 70px rgba(55, 48, 35, 0.12);
      }

      header {
        padding: clamp(30px, 6vw, 56px);
        border-bottom: 1px solid rgba(23, 23, 19, 0.1);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #6e5de7;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(38px, 7vw, 68px);
        font-weight: 400;
        letter-spacing: -0.045em;
      }

      header p:last-child {
        max-width: 560px;
        margin: 18px 0 0;
        color: #666158;
        font-size: 17px;
        line-height: 1.55;
      }

      form {
        padding: clamp(30px, 6vw, 56px);
      }

      label {
        display: block;
        margin-bottom: 12px;
        font-size: 14px;
        font-weight: 800;
      }

      input {
        width: 100%;
        min-height: 58px;
        padding: 0 18px;
        border: 1px solid #c8c1b5;
        border-radius: 15px;
        outline: none;
        background: white;
        color: #171713;
        font: inherit;
        font-size: 17px;
      }

      input:focus {
        border-color: #6e5de7;
        box-shadow: 0 0 0 4px rgba(110, 93, 231, 0.13);
      }

      .note {
        margin: 14px 0 0;
        color: #777269;
        font-size: 13px;
      }

      button {
        margin-top: 30px;
        min-height: 52px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #191915;
        color: white;
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Northstar · General request</p>
        <h1>Tell us who you are.</h1>
        <p>
          We use your name only to personalize the next step. Mochi should fill
          this field without submitting the form.
        </p>
      </header>
      <form>
        <label for="name">Full name</label>
        <input
          id="name"
          name="name"
          type="text"
          autocomplete="name"
          placeholder="Type your full name"
        />
        <p class="note">You can review this before continuing.</p>
        <button type="button">Continue</button>
      </form>
    </main>
  </body>
</html>
