<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jamie Chen — Profile context</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #171713;
        background: #eeeae1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background:
          radial-gradient(circle at 85% 15%, #d9d1ff 0 13%, transparent 36%),
          #eeeae1;
      }

      main {
        width: min(920px, 100%);
        padding: clamp(32px, 7vw, 76px);
        border: 1px solid rgba(23, 23, 19, 0.14);
        border-radius: 36px;
        background: rgba(255, 253, 247, 0.94);
        box-shadow: 0 32px 80px rgba(49, 43, 31, 0.12);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #6e5de7;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(46px, 8vw, 92px);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 650px;
        margin: 30px 0 42px;
        color: #55534d;
        font-size: clamp(18px, 2.5vw, 24px);
        line-height: 1.5;
      }

      dl {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 0;
      }

      dl div {
        min-height: 132px;
        padding: 20px;
        border-radius: 22px;
        background: #f2efe7;
      }

      dt {
        margin-bottom: 16px;
        color: #777269;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      dd {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.35;
      }

      @media (max-width: 680px) {
        dl {
          grid-template-columns: 1fr;
        }

        dl div {
          min-height: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Profile context · page 2 of 2</p>
      <h1>Jamie Chen</h1>
      <p class="intro">
        Product designer focused on making complex workflows feel calm,
        legible, and human.
      </p>
      <dl>
        <div>
          <dt>Location</dt>
          <dd>Kuala Lumpur, Malaysia</dd>
        </div>
        <div>
          <dt>Experience</dt>
          <dd>6 years in product design</dd>
        </div>
        <div>
          <dt>Strength</dt>
          <dd>Research-led systems thinking</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
